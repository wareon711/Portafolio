<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Backoffice</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="fondo">
  <main class="centro">
    <section class="caja">
      <header class="arriba">
        <h1 class="titulo">Crear Cuenta</h1>
        <p class="subtitulo">Regístrate en el Backoffice</p>
      </header>

      <form class="forma" id="formRegistro">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Mínimo 6 caracteres" autocomplete="name" minlength="6"
            required>
        </div>

        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="tu@correo.com" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="itsonId">ID ITSON</label>
          <input type="text" id="itsonId" name="itsonId" placeholder="6 dígitos (ej. 216578)" minlength="6" maxlength="6"
            required>
        </div>

        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" name="clave" placeholder="Mínimo 6 caracteres" autocomplete="new-password"
            minlength="6" required>
        </div>

        <p id="mensaje" class="mensaje"></p>

        <button type="submit" class="boton">Registrarse</button>
      </form>

      <nav class="pie">
        <p>¿Ya tienes cuenta? <a class="enlace" href="login.html">Inicia sesión</a></p>
      </nav>
    </section>
  </main>

  <script src="js/registro.js"></script>
</body>

</html>
